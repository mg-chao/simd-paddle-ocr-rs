name: Rust foundations
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo test --locked --all-features
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: target/reference-models
          key: reference-models-${{ hashFiles('tests/fixtures/step12/index.json') }}
      - run: python -m unittest discover -s tools/tests
      - run: python tools/prepare-step12-fixtures.py
      - run: cargo test --release --locked --test model_import all_shipped_models_match_authoritative_imports -- --ignored
        env:
          SIMDOCR_IMPORT_REFERENCE: target/step12-fixtures/imports
      - run: cargo test --release --locked --test step12_harness compact_real_models_match_all_detector_and_pixel_stages -- --ignored
      - run: cargo test --release --locked --test line_pipeline -- --ignored
