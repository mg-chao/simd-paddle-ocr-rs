name: Scalar OCR validation
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      cold_cache:
        description: Ignore the reference asset cache to verify clean acquisition
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo test --locked --all-features
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.cold_cache }}
        with:
          path: target/reference-models
          key: reference-assets-${{ runner.os }}-${{ hashFiles('tests/fixtures/step12/index.json') }}
          restore-keys: reference-assets-${{ runner.os }}-
      - run: python -m unittest discover -s tools/tests
      - name: Acquire and verify reference assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force target/ci-reports | Out-Null
          Copy-Item tests/fixtures/step12/index.json target/ci-reports/fixture-index.json
          python tools/prepare-step12-fixtures.py 2>&1 | Tee-Object target/ci-reports/preparation.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: cargo test --release --locked --test model_import all_shipped_models_match_authoritative_imports -- --ignored
        env:
          SIMDOCR_IMPORT_REFERENCE: target/step12-fixtures/imports
      - run: cargo test --release --locked --test step12_harness compact_real_models_match_all_detector_and_pixel_stages -- --ignored
      - run: cargo test --release --locked --test line_pipeline -- --ignored
      - name: Complete native REC and OCR parity
        shell: pwsh
        env:
          SIMDOCR_REC_REFERENCE: target/step12-fixtures/tiny-ocr-ci-v1
          SIMDOCR_OCR_REFERENCE: target/step12-fixtures/tiny-ocr-ci-v1
          SIMDOCR_SMALL_OCR_REFERENCE: target/step12-fixtures/small-ocr-ci-v1
          SIMDOCR_MEDIUM_OCR_REFERENCE: target/step12-fixtures/medium-ocr-ci-v1
        run: |
          New-Item -ItemType Directory -Force target/ci-reports | Out-Null
          git rev-parse HEAD | Set-Content target/ci-reports/checkout.txt
          rustc -Vv | Set-Content target/ci-reports/rustc.txt
          $testNames = @{}
          foreach ($harness in 'rec_harness', 'ocr_harness') {
            $testNames[$harness] = @(cargo test --release --locked --test $harness -- --list)
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          function Invoke-ParityTest([string]$family, [string]$harness, [string]$test) {
            if ($testNames[$harness] -notcontains "${test}: test") { throw "Required test is missing: $harness/$test" }
            cargo test --release --locked --test $harness $test -- --ignored --exact 2>&1 | Tee-Object "target/ci-reports/$family-$test.log"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          foreach ($family in 'tiny', 'small', 'medium') {
            $reference = "target/step12-fixtures/$family-ocr-ci-v1"
            $env:SIMDOCR_REC_REFERENCE = $reference
            $env:SIMDOCR_OCR_REFERENCE = $reference
            Invoke-ParityTest $family rec_harness "all_frozen_${family}_rec_lines_match_authoritative_native_reference"
            Invoke-ParityTest $family ocr_harness "complete_${family}_ocr_matches_every_native_stage_and_public_result"
            Invoke-ParityTest $family ocr_harness complete_ocr_rejects_rehashed_omissions_and_out_of_range_lines
            Invoke-ParityTest $family ocr_harness complete_ocr_rejects_floating_integer_fields_even_after_rehash
          }
      - name: Instrumented warmed allocation gates
        shell: pwsh
        run: |
          cargo build --release --locked --features heap-profiler --bin ocr-benchmark
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $suffix = if ($IsWindows) { '.exe' } else { '' }
          $executable = Join-Path (Resolve-Path target/release) "ocr-benchmark$suffix"
          foreach ($family in 'tiny', 'small', 'medium') {
            $reference = "target/step12-fixtures/$family-ocr-ci-v1"
            foreach ($mode in 'rec_public_borrowed', 'ocr_borrowed', 'mixed_widths') {
              $report = "target/ci-reports/$family-$mode.json"
              & $executable --reference $reference --mode $mode --warmup 3 --samples 3 2> "target/ci-reports/$family-$mode.stderr.log" | Set-Content $report
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              python tools/assert-allocation-smoke.py --report $report --reference $reference --mode $mode --executable $executable --warmup 3 --samples 3
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scalar-ocr-validation-${{ runner.os }}
          path: target/ci-reports
          if-no-files-found: warn
