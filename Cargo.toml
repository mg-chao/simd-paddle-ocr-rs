[package]
name = "simd-paddle-ocr-rs"
version = "0.1.0"
edition = "2024"
description = "PaddleOCR inference in Rust with SIMD CPU and optional GPU execution"
license = "Apache-2.0"
repository = "https://github.com/mg-chao/simd-paddle-ocr-rs"
keywords = ["ocr", "paddleocr", "simd", "onnx", "inference"]
categories = ["computer-vision", "science"]
include = [
    "src/**",
    "examples/ocr.rs",
    "examples/gpu_compare.rs",
    "examples/gpu_ocr_bench.rs",
    "examples/support/ocr_compare.rs",
    "docs/cpu-usage.md",
    "docs/architecture.md",
    "docs/macos-cpu-validation.md",
    "docs/gpu-usage.md",
    "docs/gpu-validation.md",
    "docs/vulkan-performance.md",
    "licenses/**",
    "Cargo.toml",
    "build.rs",
    "Cargo.lock",
    "rust-toolchain.toml",
    "README.md",
    "LICENSE",
    "NOTICE",
]

[features]
default = ["parallel"]
parallel = ["dep:rayon"]
profiling = ["dep:libc"]
gpu = ["dep:ash", "dep:gpu-allocator", "dep:shaderc", "dep:serde_json", "dep:bytemuck", "dep:half"]

[dependencies]
serde = { version = "1", features = ["derive"] }
rayon = { version = "1.11", optional = true }

[target.'cfg(not(target_os = "macos"))'.dependencies]
bytemuck = { version = "1", optional = true }
half = { version = "2.7", optional = true }
ash = { version = "=0.38.0", optional = true }
gpu-allocator = { version = "=0.28.0", default-features = false, features = ["vulkan", "std"], optional = true }

[target.'cfg(not(target_os = "macos"))'.build-dependencies]
shaderc = { version = "=0.10.1", features = ["build-from-source"], optional = true }
serde_json = { version = "1", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
libc = { version = "0.2", optional = true }

[dev-dependencies]
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

[[example]]
name = "gpu_compare"
required-features = ["gpu"]

[[example]]
name = "gpu_ocr_bench"
required-features = ["gpu"]

[target.'cfg(target_os = "macos")'.dev-dependencies]
libc = "0.2"
