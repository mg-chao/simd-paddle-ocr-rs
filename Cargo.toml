[package]
name = "simd-paddle-ocr-rs"
version = "0.1.0"
edition = "2024"
description = "PaddleOCR inference in Rust with SIMD CPU and optional GPU execution"
license = "Apache-2.0"
repository = "https://github.com/mg-chao/simd-paddle-ocr-rs"
keywords = ["ocr", "paddleocr", "simd", "onnx", "inference"]
categories = ["computer-vision", "science"]
include = [
    "src/**",
    "examples/ocr.rs",
    "examples/gpu_compare.rs",
    "examples/gpu_ocr_bench.rs",
    "examples/support/ocr_compare.rs",
    "docs/cpu-usage.md",
    "docs/architecture.md",
    "docs/macos-cpu-validation.md",
    "docs/gpu-usage.md",
    "docs/gpu-validation.md",
    "docs/gpu-performance.md",
    "licenses/**",
    "Cargo.toml",
    "Cargo.lock",
    "rust-toolchain.toml",
    "README.md",
    "LICENSE",
    "NOTICE",
]

[features]
default = ["parallel"]
parallel = ["dep:rayon"]
profiling = ["dep:libc"]
gpu = ["dep:wgpu", "dep:pollster", "dep:bytemuck", "dep:half", "dep:objc2", "dep:objc2-metal", "dep:objc2-foundation", "dep:naga"]

[dependencies]
serde = { version = "1", features = ["derive"] }
rayon = { version = "1.11", optional = true }
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "parking_lot", "metal"], optional = true }
pollster = { version = "0.4", optional = true }
bytemuck = { version = "1", optional = true }
half = { version = "2.7", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
libc = { version = "0.2", optional = true }
objc2 = { version = "=0.6.5", optional = true }
objc2-metal = { version = "=0.3.2", optional = true }
objc2-foundation = { version = "=0.3.2", optional = true }
naga = { version = "=30.0.1", features = ["wgsl-in", "msl-out"], optional = true }

[dev-dependencies]
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

[[example]]
name = "gpu_compare"
required-features = ["gpu"]

[[example]]
name = "gpu_ocr_bench"
required-features = ["gpu"]

[target.'cfg(target_os = "macos")'.dev-dependencies]
libc = "0.2"
